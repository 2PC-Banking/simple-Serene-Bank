services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bank2pc-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-StrongPassw0rd!123}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bank2pc-backend
    environment:
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_SERVER: db,1433
      DB_NAME: BankDB
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-StrongPassw0rd!123}
      DB_TRUSTED_CONNECTION: "false"
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      APP_HOST: 0.0.0.0
      APP_PORT: "8001"
      DEBUG: "false"
      LOCK_TIMEOUT: "30"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: bank2pc-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  mssql_data:
